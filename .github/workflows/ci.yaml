name: autumn-grade
on:
  push:
    branches: [master]
  pull_request_target:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  self-test:
    # Instructor changes only: course tooling and tests must build and pass on the stubs.
    # Required by branch protection instead of grade, which is red on the stubs by design.
    # Skipped for fork PRs, so student code never runs outside the sandbox.
    if: ${{ github.repository == 'ippaveln/industry_backend_go_autumn_2026' && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet (compiles task tests against the stubs)
        run: go vet ./...
      - name: Test course tooling
        run: go test -race ./cmd/...
  grade:
    # Authoritative PR checks run in the instructor repository, with its workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ippaveln/industry_backend_go_autumn_2026
          ref: master
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: baseline/go.mod
          cache: false
      - name: Prepare sandbox image
        run: docker pull golang:1.27.1
      - name: Grade with instructor tools and tests
        env:
          CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # Instructor tools run from the baseline module; the candidate is only input data.
        working-directory: baseline
        run: go run ./cmd/grade --baseline . --candidate ../candidate --out ../results
      - name: Generate badges
        if: ${{ !cancelled() }}
        working-directory: baseline
        run: go run ./cmd/badges --in ../results/package-results.json --out ../results/badges/tasks
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: autumn-results
          path: results
          if-no-files-found: error
      - name: Deliver analytics
        if: ${{ !cancelled() && github.repository == 'ippaveln/industry_backend_go_autumn_2026' }}
        continue-on-error: true
        run: |
          test -s results/analytics.json
          curl --fail-with-body --connect-timeout 3 --max-time 15 -H 'Content-Type: application/json' --data-binary @results/analytics.json https://api.ippaveln.xyz/analytics_industry_backend_go
  badges:
    # Forks only: commit this run's badges so the task READMEs show the current status.
    # The official check ignores badges/tasks/*.svg, so these commits never break it.
    needs: grade
    if: ${{ !cancelled() && github.event_name == 'push' && github.repository != 'ippaveln/industry_backend_go_autumn_2026' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: badges-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: autumn-results
          path: ${{ runner.temp }}/results
      - name: Commit badges
        run: |
          cp "$RUNNER_TEMP"/results/badges/tasks/task_*.svg badges/tasks/
          git add badges/tasks
          if git diff --cached --quiet; then
            echo "badges are up to date"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898283+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Update task badges [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
  task:
    needs: grade
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        id: ['00', '01', '02', '03', '04', '05', '06', '07', '08', '09', '10']
    name: task_${{ matrix.id }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ippaveln/industry_backend_go_autumn_2026
          ref: master
          path: baseline
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: baseline/go.mod
          cache: false
      - uses: actions/download-artifact@v6
        with:
          name: autumn-results
          path: results
      - name: Require explicit pass and valid file policy
        env:
          TASK_ID: ${{ matrix.id }}
        working-directory: baseline
        run: go run ./cmd/checkstatus --results ../results --task "task_${TASK_ID}"
